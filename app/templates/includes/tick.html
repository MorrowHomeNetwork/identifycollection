{# One tick box with its sentence. #}
<div class="field tick{% if field.errors %} field-invalid{% endif %}">
  <label class="choice">{{ field }} <span>{{ field.label }}</span></label>
  {% if field.errors %}
  <ul class="field-errors" id="{{ field.auto_id }}_error">{% for error in field.errors %}<li>{{ error }}</li>{% endfor %}</ul>
  {% endif %}
</div>
